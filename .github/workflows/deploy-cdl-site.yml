# Deploys cdl-site/ to Cloudflare Pages.
#
# One-time setup (only you can do these — they need your Cloudflare account):
#   1. My Profile → API Tokens → Create Token → template "Edit Cloudflare Workers",
#      or a custom token with the  Account › Cloudflare Pages › Edit  permission.
#   2. This repo → Settings → Secrets and variables → Actions → New repository secret:
#        CLOUDFLARE_API_TOKEN   the token from step 1
#        CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard → Workers & Pages → Account ID
#          (right-hand sidebar)
#   That's it. The workflow creates the Pages project itself on first run.
#
#   Afterwards, to put it on the real domain:
#     Pages project → Custom domains → Set up a domain → cdl.wichitafallsequipment.com.
#     If this domain's DNS is already on Cloudflare the record is created for you;
#     otherwise add the CNAME it shows you wherever the DNS is hosted.
#
# Note: the CNAME file in cdl-site/ is a GitHub Pages convention. Cloudflare Pages ignores
# it — the custom domain is attached in step 5 instead.

name: Deploy CDL site

on:
  push:
    branches:
      - master
      - claude/wichita-falls-cdl-tests-xrkwq3
    paths:
      - 'cdl-site/**'
      - '.github/workflows/deploy-cdl-site.yml'
  workflow_dispatch:

env:
  PROJECT_NAME: wichita-falls-cdl

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Regenerate the single-file bundle so dist/ can never ship stale.
      - name: Build single-file bundle
        working-directory: cdl-site
        run: node build-standalone.js

      # Stage only what should be publicly served — not the README or the build script.
      - name: Stage publish directory
        run: |
          mkdir -p publish
          cp -r cdl-site/assets cdl-site/data cdl-site/dist publish/
          cp cdl-site/index.html cdl-site/test.html cdl-site/robots.txt \
             cdl-site/sitemap.xml cdl-site/CNAME publish/
          echo "Publishing:" && find publish -type f | sort

      # Idempotent: succeeds the first time, harmlessly reports "already exists" after.
      - name: Create Pages project if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create "$PROJECT_NAME" --production-branch=main \
            || echo "Project already exists — continuing to deploy."

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy publish \
            --project-name="$PROJECT_NAME" --branch=main
